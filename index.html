<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/index.css">


    <title>Form</title>
</head>
<header>Get in Touch</header>
<body>
    <main>
        <section>
            <form action="#" method="post">
                <div class="form__row">
                    <div class="form__field">
                        <label for="firstname">First Name</label>
                        <input type="text" id="firstname" name="firstname" class="form__names" placeholder="First Name" required>
                    </div>

                    <div class="form__field">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname" name="lastname" class="form__names" placeholder="Last Name">
                    </div>
                </div>

                <div class="form__field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form__email" placeholder="Email Address" required>
                </div>

                <div class="form__field">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" class="form__email" placeholder="Subject">
                </div>

                <div class="form__field">
                    <label for="message">Drop a Message</label>
                    <textarea id="message" name="message" class="form__message" placeholder="Drop a Message" rows="6" required></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
</body>
</html>
